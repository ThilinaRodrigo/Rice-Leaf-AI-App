version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: riceleaf_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-riceleafdb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-riceleafdb}"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend-go:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-riceleafai}/rice-leaf-backend:latest
    container_name: riceleaf_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-riceleafdb}?sslmode=disable
      - ML_SERVICE_URL=http://ml-service:8000
      - RICE_VALIDATOR_THRESHOLD=${RICE_VALIDATOR_THRESHOLD:-0.50}
      - MAX_IMAGE_SIZE_MB=${MAX_IMAGE_SIZE_MB:-10}
      - BASE_URL=${BASE_URL:-https://api.yourdomain.com}
      - JWT_SECRET=${JWT_SECRET:-super-secret-rice-leaf-key-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - app-network

  ml-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-riceleafai}/rice-leaf-ml-service:latest
    container_name: riceleaf_ml_service
    restart: always
    environment:
      - RICE_VALIDATOR_THRESHOLD=${RICE_VALIDATOR_THRESHOLD:-0.50}
      - VALIDATOR_MODEL_PATH=${VALIDATOR_MODEL_PATH:-models/rice_leaf_validator.keras}
      - MODEL_PATH=${MODEL_PATH:-models/model1.keras}
      - MODEL_S3_URL=${MODEL_S3_URL:-}
      - VALIDATOR_MODEL_S3_URL=${VALIDATOR_MODEL_S3_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    ports:
      - "8000:8000"
    networks:
      - app-network

  sysadmin-web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-riceleafai}/rice-leaf-admin-web:latest
    container_name: riceleaf_admin_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-go
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
