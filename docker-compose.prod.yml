version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: riceleaf_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-riceleafdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend-go:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/rice-leaf-backend:latest
    container_name: riceleaf_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-riceleafdb}?sslmode=disable
      - ML_SERVICE_URL=http://ml-service:8000
      - BASE_URL=${BASE_URL:-http://rice.ai.thilinarodrigo.me}
      - JWT_SECRET=${JWT_SECRET:-super-secret-rice-leaf-key-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - postgres
      - ml-service
    networks:
      - app-network

  ml-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/rice-leaf-ml-service:latest
    container_name: riceleaf_ml_service
    restart: always
    ports:
      - "8000:8000"
    networks:
      - app-network

  sysadmin-web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/rice-leaf-admin-web:latest
    container_name: riceleaf_admin_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-go
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
