<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.5" />

  <!-- Ambient glow on leaf -->
  <path d="M18 46 C 16 31, 28 16, 47 12 C 49 30, 38 46, 18 46 Z" fill="#10b981" opacity="0.3" filter="url(#glow)"/>

  <!-- Main Rice Leaf -->
  <path d="M18 46 C 16 31, 28 16, 47 12 C 49 30, 38 46, 18 46 Z" fill="url(#leafGrad)" />

  <!-- Secondary Leaf Shadow / Accent -->
  <path d="M22 46 C 21 37, 27 28, 38 24 C 36 34, 30 42, 22 46 Z" fill="#047857" opacity="0.5"/>

  <!-- Leaf Center Vein -->
  <path d="M18 46 Q 30 32 47 12" stroke="url(#veinGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Side Vein 1 -->
  <path d="M27 35 Q 23 29 19 26" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Side Vein 2 -->
  <path d="M33 29 Q 39 27 43 23" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- AI Accent Dot / Sparkle at leaf tip -->
  <circle cx="47" cy="12" r="3.5" fill="#a7f3d0" />
  <circle cx="47" cy="12" r="1.8" fill="#ffffff" />
</svg>